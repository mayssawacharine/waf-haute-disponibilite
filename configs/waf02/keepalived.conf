global_defs {
    router_id WAF02
}
vrrp_script chk_nginx {
    script "/usr/bin/pgrep nginx"
    interval 2
    fall 2
    rise 2
}
vrrp_instance VI_1 {
    state BACKUP
    interface ens224
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME
    }
    virtual_ipaddress {
        192.168.56.100/24
    }
    track_script {
        chk_nginx
    }
}
